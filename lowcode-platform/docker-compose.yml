services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lowcode
      POSTGRES_USER: lowcode
      POSTGRES_PASSWORD: lowcode
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_NAME: lowcode
      DB_USER: lowcode
      DB_PASSWORD: lowcode
      # Без этой переменной используется insecure dev-дефолт из application.yml —
      # нормально для локальной разработки, но ОБЯЗАТЕЛЬНО переопределить в
      # любом реальном окружении (см. README, "Аутентификация и роли — Stage 1").
      # JWT_SECRET: change-me-to-a-real-secret-at-least-32-bytes-long
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
