name: CI

# Раздел 0 ревью CTO: "непроверенный код — это не «сделано», это «написано»".
# Ни один коммит с этого момента не должен мержиться без зелёного прогона здесь.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lowcode
          POSTGRES_USER: lowcode
          POSTGRES_PASSWORD: lowcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Исполняемый бит gradlew иногда теряется при переносе файлов между ОС
      # (архивы/Windows-чекауты не всегда сохраняют Unix-permissions) — even
      # если он верно закоммичен в git, лишний chmod здесь ничего не портит
      # (идемпотентно), а если бит всё же потерян — actions/checkout молча
      # принёс бы файл без +x, и следующий шаг упал бы с "Permission denied"
      # ещё до того, как стало бы понятно, в чём дело.
      - name: Ensure gradlew is executable
        working-directory: backend
        run: chmod +x gradlew

      # BlockAndEntryPointDeleteCascadeIntegrationTest поднимает свой Postgres
      # через Testcontainers — нужен Docker, на ubuntu-latest он уже есть.
      - name: Backend build + test
        working-directory: backend
        run: ./gradlew build --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: lowcode
          DB_USER: lowcode
          DB_PASSWORD: lowcode
          JWT_SECRET: ci-only-secret-not-for-any-real-deployment-32-bytes-min

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npx vite build
